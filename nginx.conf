events {}

http {
  server {
    listen 80;

    # Endpoint 1: returns HTTP 200
    location /success {
      default_type text/plain;
      return 200 "OK - this is a 200 response\n";
    }

    # Endpoint 2: returns HTTP 500
    location /error {
      default_type text/plain;
      return 500 "Internal Server Error - this is a 500 response\n";
    }
  }
}